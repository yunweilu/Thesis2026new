<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="180"
   height="120"
   viewBox="0 0 180 120"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  
  <!-- Noise curve with irregular fluctuations -->
  <path
     d="M 55,60 L 60,20 L 65,105 L 70,15 L 75,95 L 80,25 L 85,110 L 90,95 L 95,20 L 100,108 L 105,95 L 110,25 L 115,95 L 120,115 L 125,100 L 130,20 L 135,95 L 140,110 L 145,95 L 150,25 L 155,100"
     style="fill:none;stroke:#808080;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"
     id="noise-path" />
  
  <!-- Arrow pointing left, tail connects to noise trajectory at start -->
  <path
     d="M 55,60 L 10,60"
     style="fill:none;stroke:#808080;stroke-width:2.5;stroke-linecap:round"
     id="arrow-line" />
  <path
     d="M 10,60 L 18,56 L 18,64 Z"
     style="fill:#808080;stroke:#808080;stroke-width:1"
     id="arrow-head" />
  
</svg>
