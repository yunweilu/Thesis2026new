<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%" gradientTransform="rotate(10)">
      <stop offset="10%" stop-color="#ffee99" /> <stop offset="45%" stop-color="#d4af37" /> <stop offset="90%" stop-color="#8a7020" /> </linearGradient>
    <radialGradient id="goldFaceGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffde6" /> <stop offset="100%" stop-color="#d4af37" />
    </radialGradient>

    <linearGradient id="greyBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%" gradientTransform="rotate(10)">
       <stop offset="5%" stop-color="#ffffff" stop-opacity="0.9"/> <stop offset="25%" stop-color="#d9d9d9" />
      <stop offset="60%" stop-color="#999999" />
      <stop offset="100%" stop-color="#595959" /> </linearGradient>
    
    <linearGradient id="greyRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" /> <stop offset="50%" stop-color="#b3b3b3" />
      <stop offset="100%" stop-color="#4d4d4d" /> </linearGradient>

    <radialGradient id="innerHoleGrad" cx="50%" cy="50%" r="50%">
        <stop offset="70%" stop-color="#2a2a2a"/>
        <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <path d="M 120,85 C 120,85 350,130 380,140 C 395,180 380,250 350,260 C 300,250 120,195 120,195" 
        fill="url(#greyBodyGrad)" stroke="none"/>
  <ellipse cx="365" cy="200" rx="25" ry="65" fill="url(#greyBodyGrad)" transform="rotate(-10 365 200)"/>


  <ellipse cx="120" cy="140" rx="35" ry="68" fill="url(#greyRimGrad)" transform="rotate(-12 120 140)"/>
  <ellipse cx="122" cy="141" rx="28" ry="55" fill="url(#innerHoleGrad)" transform="rotate(-12 122 141)"/>


  <path d="M 20,95 L 125,118 L 125,165 L 20,145 Z" fill="url(#goldBodyGrad)"/>
  <ellipse cx="20" cy="120" rx="15" ry="25" fill="url(#goldFaceGrad)" transform="rotate(-12 20 120)"/>

</svg>
