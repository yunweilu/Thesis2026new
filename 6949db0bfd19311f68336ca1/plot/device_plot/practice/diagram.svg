<svg width="600" height="500" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white" />

  <g transform="translate(50, 50)">
    <line x1="50" y1="100" x2="250" y2="100" stroke="black" stroke-width="2" />
    <line x1="300" y1="40" x2="500" y2="40" stroke="black" stroke-width="2" />
    
    <line x1="50" y1="115" x2="250" y2="115" stroke="red" stroke-width="1.5" />
    
    <line x1="250" y1="100" x2="300" y2="40" stroke="red" stroke-dasharray="5,5" />
    <!-- A/2 label -->
    <text x="295" y="75" fill="red" font-family="serif" font-size="14" text-anchor="middle">$\frac{A}{2}$</text>
    
    <text x="10" y="105" font-family="serif" font-size="18">$|g,1\rangle$</text>
    <text x="260" y="45" font-family="serif" font-size="18">$|e,1\rangle$</text>
    
    <!-- Red double arrow between black and red lines -->
    <path d="M 260 100 L 260 115" stroke="red" marker-start="url(#redarrow)" marker-end="url(#redarrow)" fill="none" />
    <!-- -A²/4(δs+χ) label -->
    <text x="290" y="112" fill="red" font-family="serif" font-size="12">$-\frac{A^2}{4(\delta_s+\chi)}$</text>
  </g>

  <g transform="translate(50, 280)">
    <line x1="50" y1="100" x2="250" y2="100" stroke="black" stroke-width="2" />
    <line x1="300" y1="40" x2="500" y2="40" stroke="black" stroke-width="2" />
    
    <line x1="50" y1="115" x2="250" y2="115" stroke="red" stroke-width="1.5" />
    
    <line x1="250" y1="100" x2="300" y2="40" stroke="red" stroke-dasharray="5,5" />
    <!-- A/2 label -->
    <text x="295" y="75" fill="red" font-family="serif" font-size="14" text-anchor="middle">$\frac{A}{2}$</text>
    
    <text x="10" y="105" font-family="serif" font-size="18">$|g,0\rangle$</text>
    <text x="260" y="45" font-family="serif" font-size="18">$|e,0\rangle$</text>
    
    <!-- Red double arrow between black and red lines -->
    <path d="M 260 100 L 260 115" stroke="red" marker-start="url(#redarrow)" marker-end="url(#redarrow)" fill="none" />
    <!-- -A²/4δs label -->
    <text x="290" y="112" fill="red" font-family="serif" font-size="12">$-\frac{A^2}{4\delta_s}$</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="red" />
    </marker>
  </defs>
</svg>